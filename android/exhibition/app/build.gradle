plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.openbuy.exhibition'
    compileSdk 37

    defaultConfig {
        applicationId 'ai.openbuy.exhibition'
        minSdk 28
        targetSdk 35
        versionCode 15
        versionName '0.6.0'
        testInstrumentationRunner 'ai.openbuy.exhibition.NativeGestureInstrumentation'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        uiPreview {
            initWith debug
            applicationIdSuffix '.uipreview'
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
        }
    }
}

// Reuse the reviewed web model without checking a second binary into the repository.
def gestureAssets = layout.buildDirectory.dir('generated/gesture-assets')
def copyGestureModel = tasks.register('copyGestureModel', Copy) {
    from("${rootProject.projectDir}/../../public/assets/exhibition-gestures") {
        include 'hand_landmarker.task', 'LICENSE*'
    }
    into(gestureAssets.map { it.dir('exhibition-gestures') })
}
android.sourceSets.main.assets.srcDir(gestureAssets.get().asFile)
tasks.named('preBuild').configure { dependsOn(copyGestureModel) }

dependencies {
    implementation project(':xmax-sdk')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    // Already supplied by the XMAX COS dependency; expose DNS customization to the LAN client.
    implementation 'com.squareup.okhttp3:okhttp:3.12.6'
    implementation 'com.google.mediapipe:tasks-vision:0.10.32'
}
