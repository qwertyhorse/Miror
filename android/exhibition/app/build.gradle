plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.openbuy.exhibition'
    compileSdk 37

    defaultConfig {
        applicationId 'ai.openbuy.exhibition'
        minSdk 28
        targetSdk 35
        versionCode 12
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        uiPreview {
            initWith debug
            applicationIdSuffix '.uipreview'
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation project(':xmax-sdk')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    // Already supplied by the XMAX COS dependency; expose DNS customization to the LAN client.
    implementation 'com.squareup.okhttp3:okhttp:3.12.6'
}
